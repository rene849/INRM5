/* ── Tokens & Base Variables (Matched to Baseline M1) ── */
:root{
  --red:#E3120B; --navy:#1F2E7A; --navy-deep:#141F52;
  --blue:#2E45B8; --teal:#36E2BD; --cream:#EBE9E0;
  --ink:#0f172a; --muted:#5a5f73; --rule:#d7d9e0;
  --maxw:1320px;
  --pad:clamp(18px,4vw,52px);
  color-scheme: only light;
}

/* Belt-and-braces: Lock background & prevent vertical scrollbars matching Base M1 */
html, body{
  background:#fff !important;
  color:#0f172a !important;
  overflow-x:hidden !important;
  overflow-y:hidden !important;
  height:100% !important;
  margin:0;padding:0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:2px;}

/* ── Screen switching ── */
.screen{display:none;}
.screen.is-active{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  height:100vh;
  min-height:580px;
}

/* ── APPBAR (Matched to Baseline M1) ── */
.appbar{
  position:relative;z-index:40;flex:none;
  background:#fff;
  height:60px;
  display:flex;align-items:stretch;
}
.appbar-inner{
  width:100%;max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:stretch;
  padding:0 var(--pad);position:relative;
}
.appbar-inner::after{
  content:'';position:absolute;left:var(--pad);right:var(--pad);bottom:0;
  height:1px;background:var(--rule);
}
.appbar-title{flex:1;display:flex;align-items:center;
  padding:0;font-size:14px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar-tools{display:flex;align-items:center;gap:8px;flex:none;}

/* Icon Buttons SVG Rules from Baseline M1 */
.icon-btn{
  --ring:#2E45B8; --ring-fill:transparent; --glyph:#2E45B8;
  width:36px;height:36px;padding:0;border:0;background:none;
  cursor:pointer;flex:none;display:block;border-radius:50%;
  transition:none;
}
.icon-btn svg{width:100%;height:100%;display:block;overflow:visible;}
.icon-btn .ring{fill:var(--ring-fill);stroke:var(--ring);stroke-width:1;}
.icon-btn .glyph{fill:var(--glyph);}
.icon-btn .xglyph{fill:none;stroke:var(--glyph);stroke-width:2;stroke-linecap:butt;}
.icon-btn:hover,.icon-btn:focus-visible{--ring:#1f2e7a;--ring-fill:#ebedfa;--glyph:#1f2e7a;}
.icon-btn:active{--ring:#1dc9a4;--ring-fill:transparent;--glyph:#1f2e7a;}

#cover{overflow:hidden;}
.cover-stage{
  position:relative;width:100%;max-width:var(--maxw);margin:0 auto;
  display:grid;
  padding:clamp(12px,2vw,24px) clamp(18px,4vw,52px);
  flex:1 0 auto;align-content:center;overflow:visible;
}
.cover-text{
  grid-area:1/1;align-self:center;justify-self:start;
  position:relative;z-index:5;max-width:clamp(300px,42%,560px);
}
